name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 三平台 release 编译 ──
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2

      # Linux 系统依赖
      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - name: generate lockfile
        run: cargo generate-lockfile

      - name: cargo build --release
        run: cargo build --release

      # 打包二进制（Windows 用 zip，Linux/macOS 用 tar.gz）
      - name: package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/release
          tar czf ../../mcu-bridge-${{ matrix.target }}.tar.gz mcu-bridge

      - name: package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/release
          7z a ../../mcu-bridge-${{ matrix.target }}.zip mcu-bridge.exe

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcu-bridge-${{ matrix.target }}
          path: mcu-bridge-${{ matrix.target }}.${{ matrix.ext }}

  # ── 发布到 GitHub Release ──
  release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: flatten artifacts
        run: |
          find artifacts -type f | while read f; do
            cp "$f" .
          done
          ls -lh mcu-bridge-*

      - name: publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}

            Pre-built binaries for all platforms.

            | Platform | File |
            |----------|------|
            | Linux (x86_64) | `mcu-bridge-x86_64-unknown-linux-gnu.tar.gz` |
            | Windows (x86_64) | `mcu-bridge-x86_64-pc-windows-msvc.zip` |
            | macOS (x86_64) | `mcu-bridge-x86_64-apple-darwin.tar.gz` |

            See [CHANGELOG.md](./CHANGELOG.md) or commit history for details.
          files: mcu-bridge-*
          generate_release_notes: true
